name: Check Eila Core
on:
  workflow_dispatch:
  push:
    branches: [ main, legend-v2, eila-spine-v3 ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'launcher.py'
      - 'doctor.py'
      - 'config.json'
      - '.github/workflows/check-core.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q app launcher.py doctor.py tests
      - name: Import smoke test
        run: python -c "import app.main; print(app.main.CFG['version'])"
      - name: JavaScript syntax
        run: node --check app/static/app.js
      - name: Unit tests
        run: python -m pytest -q

      - name: Startup HTTP smoke test
        shell: bash
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 --log-level debug > /tmp/eila-startup.log 2>&1 &
          PID=$!
          OK=0
          for i in {1..20}; do
            if curl -fsS --max-time 2 http://127.0.0.1:8765/api/health >/tmp/eila-health.json; then
              OK=1
              break
            fi
            sleep 0.5
          done
          if [ "$OK" -ne 1 ]; then
            cat /tmp/eila-startup.log
            kill $PID || true
            exit 1
          fi
          cat /tmp/eila-health.json
          kill $PID || true
