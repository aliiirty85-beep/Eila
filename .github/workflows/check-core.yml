name: Check Eila Core
on:
  workflow_dispatch:
  push:
    branches: [ main, legend-v2 ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'launcher.py'
      - 'doctor.py'
      - '.github/workflows/check-core.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q app launcher.py doctor.py tests
      - name: Unit tests
        run: python -m pytest -q
