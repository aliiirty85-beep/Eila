<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eila Legend</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main>
<section class="hero"><div><h1>ایلا</h1><p>یک هدف. یک پاسخ. یک حرکت بعدی.</p></div><div id="status" class="pill">...</div></section>
<section class="grid">
  <article><h2>جلسه</h2><input id="goal" placeholder="هدف امروز"><textarea id="plan" placeholder="برنامه/محدودیت"></textarea><div class="row"><button id="start">شروع</button><button id="stop" class="secondary">پایان</button></div></article>
  <article class="mission"><div class="meta"><span id="theme">Theme: —</span><span id="phase">Phase: —</span><span id="pulse">Pulse: —</span></div><h2 id="instruction">ایلا منتظر شروع جلسه است.</h2><p id="salience"></p><p id="question"></p><div class="row"><input id="answer" placeholder="پاسخ کوتاه"><button id="done">تحویل</button><button id="fail" class="secondary">گیر کردم</button></div><div id="feedback"></div></article>
  <article><h2>Return Contract</h2><input id="returnText" value="ناهار؛ برگشت به مطالعه"><input id="returnMin" type="number" step="0.5" value="5"><div class="row"><button id="returnStart">ثبت</button><button id="returnAck" class="secondary">برگشتم</button></div><p id="returnState">—</p></article>
  <article><h2>وضعیت</h2><div class="stats"><span>Attention <b id="attention">—</b></span><span>Risk <b id="risk">—</b></span><span>Flow <b id="flow">—</b></span><span>Gaze <b id="gaze">—</b></span></div><p id="intervention"></p></article>
  <article><h2>چت کوتاه با ایلا</h2><textarea id="chatInput" placeholder="پیام"></textarea><button id="chatSend">ارسال</button><pre id="chatOut"></pre></article>
  <article><h2>Health</h2><button id="healthBtn">بررسی</button><pre id="health"></pre></article>
</section></main><script src="/static/app.js"></script></body></html>
